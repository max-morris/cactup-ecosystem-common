format = 1

[sim]
name = "bhns-full"
owners = ["example", "example-org"]
file = "sims/bhns.sim"
description = "A binary neutron star merger, ready to run."
contact = "mailto:help@example.org"
tag-pattern = "sim_{major}_{minor}_v{patch}"
since = "1.0.0"

[tracks.mixed-precision]
description = "The mixed-precision line"

[[fork-of]]
target = "upstream/bhns"
note = "Adds a GPU parfile"

[[depends-on]]
target = "example/carpetx"
range = ">=1.0.0, <2.0.0"
note = "Needs the new driver"

[[works-with]]
target = "example/stack"
range = "mixed-precision:^1.2"

[[incompatible-with]]
target = "other/thing"

[[caveat]]
thorn = "CarpetX/CarpetX"
note = "Needs CUDA 12"
