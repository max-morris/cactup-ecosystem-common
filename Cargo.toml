[package]
name = "cactup-ecosystem-common"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/max-morris/cactup-ecosystem-common"
description = "Shared by the Cactup ecosystem (the cactup CLI and the Cactarium registry): .sim files, manifests, stacks, slugs and track versions, the CRL thornlist parser and the CCL scanner"

# Pure Rust, no network, no system libraries: cactup links this into a static
# MUSL binary.
[dependencies]
anyhow = "1.0.102"
indexmap = { version = "2.14.0", features = ["serde"] }
regex = "1.13.0"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
toml = { version = "1.1.2", features = ["preserve_order"] }
